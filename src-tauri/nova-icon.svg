<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer constellation ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="6 8" opacity="0.8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.3" />

  <!-- Orbital nodes -->
  <circle cx="256" cy="86" r="8" fill="#2dd4bf" />
  <circle cx="426" cy="256" r="8" fill="#38bdf8" />
  <circle cx="256" cy="426" r="8" fill="#a855f7" />
  <circle cx="86" cy="256" r="8" fill="#06b6d4" />

  <!-- Central Nova 4-pointed Star -->
  <path d="M 256 116 Q 256 256 396 256 Q 256 256 256 396 Q 256 256 116 256 Q 256 256 256 116 Z"
        fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Core diamond spark -->
  <polygon points="256,180 286,256 256,332 226,256" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
