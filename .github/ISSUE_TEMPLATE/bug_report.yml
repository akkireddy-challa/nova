name: "🐛 Bug Report"
description: "File a bug or unexpected behavior in Nova Studio"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug! Please provide as much detail as possible to help us reproduce and resolve it quickly."

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what happened."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Select mode 'Deep Research'
        2. Enter prompt '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: model_used
    attributes:
      label: "Selected Model Runtime"
      options:
        - "Gemini 2.0 Flash"
        - "Claude 3.7 Sonnet"
        - "DeepSeek R1"
        - "Llama 3.3 (Local Ollama)"
        - "Offline Simulation Mode"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment Information"
      description: "OS, browser version, Bun or Node version."
      placeholder: "macOS 15.1, Chrome 133, Bun 1.2"
    validations:
      required: false
